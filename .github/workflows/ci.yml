name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Invariants, typecheck, unit tests, production build
        run: npm run check

      - name: Production build with the Pages base path
        run: GITHUB_PAGES=true npm run build

  pacing:
    name: Pacing gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Pacing gate (Phase B, 10 seeds)
        run: |
          set -o pipefail
          npm run verify:pacing -- --phase=b \
            --out=docs/evidence/pacing/m2-phase-b-pacing.json \
            2>&1 | tee docs/evidence/pacing/m2-phase-b-pacing.log

      - name: Upload pacing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacing-evidence
          path: |
            docs/evidence/pacing/*
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  variety:
    name: Variety gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Variety gate (12 seeds, idle + casual)
        run: |
          set -o pipefail
          npm run verify:variety -- --negative \
            --out=docs/evidence/variety/m3-variety.json \
            2>&1 | tee docs/evidence/variety/m3-variety.log

      - name: Upload variety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variety-evidence
          path: |
            docs/evidence/variety/*
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  twists:
    name: Twist gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Twist gate (12 seeds × idle + casual, applied probe, negative control)
        run: |
          set -o pipefail
          npm run verify:twists -- --negative \
            --out=docs/evidence/twists/m4-twists.json \
            2>&1 | tee docs/evidence/twists/m4-twists.log

      - name: Upload twist evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twist-evidence
          path: |
            docs/evidence/twists/*
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Playwright shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright shard
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
        env:
          CI: 'true'

      - name: Upload evidence and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ matrix.shard }}
          path: |
            docs/evidence/*.png
            docs/evidence/pacing/*
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
