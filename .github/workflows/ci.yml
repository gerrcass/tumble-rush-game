name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Typecheck, unit tests, production build
        run: npm run check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke and screenshot
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload evidence and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tumble-rush-evidence
          path: |
            docs/evidence/*.png
            playwright-report/
            test-results/
          if-no-files-found: ignore
